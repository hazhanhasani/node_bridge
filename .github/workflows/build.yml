name: Build BluePanel Node Bridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet all packages
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Test all packages
        env:
          BLUEPANEL_NODE_E2E: '0'
        run: go test ./... -count=1
