name: Tor Go Bridge Feature Tests

on:
  push:
    branches:
      - "feature/bluepanel-tor-multi-exit"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Run Go tests
        run: go test ./... -v

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
